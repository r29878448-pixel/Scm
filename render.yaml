services:
  - type: web
    name: sachin-academy-pro
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: GEMINI_API_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: NEXT_PUBLIC_GEMINI_API_KEY
        sync: false
